<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الدومينو الاحترافية - أونلاين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-layout">
        
        <!-- الشريط العلوي: المنافسون والمايك -->
        <header class="top-bar">
            <!-- الخصم 1 -->
            <div id="comp1-avatar" class="profile top-left">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp1" alt="الخصم 1">
                <div class="profile-info">
                    <span id="comp1-name" class="player-label">الخصم 1</span>
                    <span id="comp1-count" class="profile-count">🂠 0</span>
                </div>
            </div>

            <!-- زر المايك للتحدث -->
            <button id="mic-btn" class="btn-mic muted" onclick="toggleMic()">
                🎙️ <span id="mic-status">المايك مغلق</span>
            </button>

            <!-- الخصم 2 (عند اختيار 3 لاعبين) -->
            <div id="comp2-avatar" class="profile top-right hidden">
                <div class="profile-info">
                    <span id="comp2-name" class="player-label">الخصم 2</span>
                    <span id="comp2-count" class="profile-count">🂠 0</span>
                </div>
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp2" alt="الخصم 2">
            </div>
        </header>

        <!-- لوحة النتائج الحديثة المتناسقة -->
        <div id="scoreboard-container">
            <div class="score-card">
                <div class="score-header">
                    <span>🎯 الهدف: <strong id="ui-target-score">100</strong> نقطة</span>
                </div>
                <div class="score-body" id="score-players-list">
                    <!-- يملأ ديناميكياً بأسماء اللاعبين والنقاط -->
                </div>
            </div>
        </div>

        <!-- منطقة الطاولة -->
        <section class="table-container">
            <div id="toast-msg" class="toast-notification hidden"></div>
            <div id="board-chain"></div>
        </section>

        <!-- الشريط السفلي -->
        <footer class="bottom-bar">
            <!-- اللاعب الحقيقي -->
            <div id="player-avatar" class="profile bottom-left">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=player" alt="أنت">
                <div class="profile-info">
                    <span id="my-name-display" class="player-label">أنت</span>
                </div>
            </div>

            <!-- أوراق اللاعب -->
            <div class="bottom-center">
                <div class="player-hand-wrapper">
                    <div id="player-hand"></div>
                </div>
            </div>

            <!-- زر السوق -->
            <div class="bottom-right">
                <button class="btn-boneyard" onclick="drawFromBoneyard()">
                    🀙 السوق: <span id="boneyard-count" class="count">0</span>
                </button>
            </div>
        </footer>
    </main>

    <!-- عنصر الصوت المستلم للمايك -->
    <audio id="remote-audio" autoplay></audio>

    <!-- النافذة المنبثقة لإعداد اللعبة -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>🎲 لعبة الدومينو الاحترافية</h2>
            
            <div class="room-setup">
                <!-- ادخال اسم اللاعب -->
                <div class="form-group">
                    <label>👤 اسمك في اللعبة:</label>
                    <input type="text" id="player-name-input" class="text-input" placeholder="أدخل اسمك هنا" value="لاعب 1">
                </div>

                <div class="form-group">
                    <label>👥 عدد اللاعبين:</label>
                    <div class="btn-group">
                        <button type="button" class="opt-btn active" onclick="setSelectPlayers(2, this)">2 لاعبين</button>
                        <button type="button" class="opt-btn" onclick="setSelectPlayers(3, this)">3 لاعبين</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>🏆 نقاط الفوز:</label>
                    <div class="btn-group">
                        <button type="button" class="opt-btn" onclick="setSelectScore(50, this)">50</button>
                        <button type="button" class="opt-btn active" onclick="setSelectScore(100, this)">100</button>
                        <button type="button" class="opt-btn" onclick="setSelectScore(150, this)">150</button>
                    </div>
                </div>

                <button class="btn-primary full-btn" onclick="createRoom()">➕ إنشاء غرفة أونلاين</button>
                
                <div id="created-code-box" class="code-display hidden">
                    <span>كود الغرفة:</span>
                    <strong id="display-room-id">----</strong>
                    <small>في انتظار باقي اللاعبين...</small>
                </div>

                <div class="divider-text">أو</div>

                <div class="join-box">
                    <input type="text" id="room-code" placeholder="كود الغرفة">
                    <button class="btn-secondary" onclick="joinRoom()">🔗 انضمام</button>
                </div>
            </div>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">

            <div>
                <button class="btn-offline" onclick="selectGameMode(2)">🤖 لعب ضد الكمبيوتر</button>
            </div>
        </div>
    </div>

    <div id="end-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="end-title">انتهت اللعبة!</h2>
            <button class="btn-primary" onclick="location.reload()">🔄 العب مرة أخرى</button>
        </div>
    </div>

    <!-- === كود فايربيز === -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC28vhM3_RlSPbPYFsb2RL8DO5685Ue_p8",
        authDomain: "dominos-pro-beee8.firebaseapp.com",
        projectId: "dominos-pro-beee8",
        storageBucket: "dominos-pro-beee8.firebasestorage.app",
        messagingSenderId: "184280288087",
        appId: "1:184280288087:web:4976d9e7bd96b93bc04c12"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      window.db = db;
      window.ref = ref;
      window.set = set;
      window.update = update;
      window.onValue = onValue;
    </script>
    
    <script src="script.js?v=13.01"></script>
</body>
</html>
