<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الدومينو الاحترافية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- التايمر الجديد (يظهر بدلاً من النص القديم) -->
        <div id="turn-timer" class="timer-display hidden">⏳ 25</div>

        <!-- الطاولة -->
        <div class="poker-table">
            <!-- منطقة رسم سلسلة الأحجار -->
            <div id="board-chain" style="position: absolute; width: 100%; height: 100%;"></div>
        </div>

        <!-- منطقة الأفاتارات (مع الـ IDs المضافة لتأثير النيون) -->
        <div class="players-container">
            <!-- الكمبيوتر 1 -->
            <div id="comp1-avatar" class="avatar-container">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp1" alt="Bot 1" class="icon">
                <div>
                    <div class="name" style="font-size: 14px;">الكمبيوتر 1</div>
                    <div id="comp1-count" class="count">🂠 7</div>
                </div>
            </div>

            <!-- الكمبيوتر 2 (يظهر فقط في نمط 3 لاعبين) -->
            <div id="comp2-avatar" class="avatar-container hidden">
                <div>
                    <div class="name" style="font-size: 14px;">الكمبيوتر 2</div>
                    <div id="comp2-count" class="count">🂠 7</div>
                </div>
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp2" alt="Bot 2" class="icon">
            </div>

            <!-- أنت (اللاعب) -->
            <div id="player-avatar" class="avatar-container">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=player" alt="Player" class="icon">
                <div class="name" style="font-size: 14px;">أنت (اللاعب)</div>
            </div>
        </div>

        <!-- زر السحب من السوق -->
        <div class="boneyard-btn" onclick="drawFromBoneyard()">
            <div>🀙 السوق: <span id="boneyard-count">14</span></div>
        </div>

        <!-- منطقة أوراق اللاعب (يد اللاعب) -->
        <div class="player-area">
            <div id="player-hand"></div>
        </div>
    </main>

    <!-- النوافذ المنبثقة (شاشة البداية والنهاية) -->
    <div id="start-modal" class="modal">
        <div class="modal-content">
            <h2>أهلاً بك في الدومينو! 🎲</h2>
            <p>اختر عدد اللاعبين للبدء:</p>
            <button onclick="selectGameMode(2)">👤 ضد لاعب واحد</button>
            <button onclick="selectGameMode(3)">👥 ضد لاعبين اثنين</button>
        </div>
    </div>

    <div id="end-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="end-title">انتهت اللعبة!</h2>
            <button onclick="showStartModal()">🔄 العب مرة أخرى</button>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="script.js?v=8.7"></script>
</body>
</html>
