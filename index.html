<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة الدومينو الاحترافية - أونلاين</title>
    <!-- استدعاء ملف الـ CSS الأساسي الذي يقوم بجمع كل الملفات الأخرى -->
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="game-layout">
        
        <!-- =========================================
             الشريط العلوي (Top HUD) 
             ========================================= -->
        <header class="top-bar">
            <!-- الخصم 1 -->
            <div id="comp1-avatar" class="profile">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp1" alt="الخصم 1">
                <div class="profile-info">
                    <span id="comp1-name" class="player-label">الخصم 1</span>
                    <span id="comp1-score-avatar" class="profile-score">🏆 0</span>
                    <span id="comp1-count" class="profile-count">🂠 0</span>
                </div>
            </div>

            <!-- زر المايك -->
            <button id="mic-btn" class="btn-mic muted" onclick="toggleMic()">
                🎙️ <span id="mic-status">المايك مغلق</span>
            </button>

            <!-- الخصم 2 (يظهر في وضع 3 لاعبين فقط) -->
            <div id="comp2-avatar" class="profile hidden">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp2" alt="الخصم 2">
                <div class="profile-info">
                    <span id="comp2-name" class="player-label">الخصم 2</span>
                    <span id="comp2-score-avatar" class="profile-score">🏆 0</span>
                    <span id="comp2-count" class="profile-count">🂠 0</span>
                </div>
            </div>
        </header>

        <!-- لوحة النتائج (مخفية بالكامل عبر CSS ومتروكة هنا حتى لا يتعطل JS) -->
        <div id="scoreboard-container" class="hidden">
            <span id="ui-target-score">100</span>
            <div id="score-players-list"></div>
        </div>

        <!-- =========================================
             منطقة اللعب (The Arena) 
             ========================================= -->
        <section class="table-container">
            <div id="toast-msg" class="toast-notification hidden"></div>
            <div id="board-chain"></div>
        </section>

        <!-- =========================================
             الشريط السفلي ويد اللاعب (Bottom HUD) 
             ========================================= -->
        <footer class="bottom-bar">
            <!-- الأفاتار الخاص بك -->
            <div id="player-avatar" class="profile">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Sparky" alt="أنت">
                <div class="profile-info">
                    <span id="my-name-display" class="player-label">أنت</span>
                    <span id="player-score-avatar" class="profile-score">🏆 0</span>
                </div>
            </div>

            <!-- أوراق اللاعب (Player Hand) -->
            <div class="bottom-center">
                <div class="player-hand-wrapper">
                    <div id="player-hand"></div>
                </div>
            </div>

            <!-- زر سحب ورقة من السوق -->
            <button class="btn-boneyard" onclick="drawFromBoneyard()">
                🀙 <span id="boneyard-count" class="count">0</span>
            </button>
        </footer>
    </main>

    <!-- مسار الصوت للاتصال -->
    <audio id="remote-audio" autoplay></audio>

    <!-- =========================================
         شاشة البداية المبتكرة (Fullscreen Lobby) 
         ========================================= -->
    <div id="start-modal" class="fullscreen-lobby">
        
        <!-- مؤثرات الإضاءة الخلفية (Glow Orbs) -->
        <div class="lobby-bg-elements">
            <div class="glow-orb orb-1"></div>
            <div class="glow-orb orb-2"></div>
        </div>

        <div class="lobby-content">
            <!-- شعار اللعبة الجديد -->
            <div class="game-brand">
                <h1>الدومينو <span>PRO</span></h1>
            </div>
            
            <div class="room-setup">
                
                <!-- الخطوة 1: إدخال الاسم (تصميم مركز ونظيف) -->
                <div id="step-1" class="step-container active-step">
                    <div class="welcome-text">
                        <h3>أهلاً بك!</h3>
                        <p>أدخل اسمك لتبدأ التحدي</p>
                    </div>
                    <div class="form-group">
                        <input type="text" id="player-name-input" class="modern-input" placeholder="اكتب اسمك هنا...">
                    </div>
                    <button class="action-btn primary-btn" onclick="goToStep(2)">متابعة ➔</button>
                </div>

                <!-- الخطوة 2: اختيار وضع اللعب (نظام البطاقات التفاعلية) -->
                <div id="step-2" class="step-container">
                    <button class="nav-back" onclick="goToStep(1)">⟵ رجوع</button>
                    <div class="welcome-text">
                        <h3>كيف تود اللعب؟</h3>
                    </div>
                    
                    <div class="mode-cards-container">
                        <!-- بطاقة الأونلاين -->
                        <div class="mode-card online-card" onclick="goToStep('online')">
                            <div class="card-icon">🌐</div>
                            <div class="card-info">
                                <h4>لعب أونلاين</h4>
                                <p>تحدى أصدقاءك عبر الإنترنت</p>
                            </div>
                        </div>
                        
                        <!-- بطاقة الأوفلاين -->
                        <div class="mode-card offline-card" onclick="goToStep('offline')">
                            <div class="card-icon">🤖</div>
                            <div class="card-info">
                                <h4>لعب أوفلاين</h4>
                                <p>تدرب ضد الذكاء الاصطناعي</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- الخطوة 3 (أوفلاين): إعدادات اللعب ضد الكمبيوتر -->
                <div id="step-offline" class="step-container">
                    <button class="nav-back" onclick="goToStep(2)">⟵ رجوع</button>
                    
                    <div class="settings-panel">
                        <div class="form-group">
                            <label>👥 عدد اللاعبين</label>
                            <div class="btn-group">
                                <button type="button" class="opt-btn active" onclick="setSelectPlayers(2, this)">أنت ضد 1</button>
                                <button type="button" class="opt-btn" onclick="setSelectPlayers(3, this)">أنت ضد 2</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>🏆 نقاط الفوز</label>
                            <div class="btn-group">
                                <button type="button" class="opt-btn" onclick="setSelectScore(50, this)">50</button>
                                <button type="button" class="opt-btn active" onclick="setSelectScore(100, this)">100</button>
                                <button type="button" class="opt-btn" onclick="setSelectScore(150, this)">150</button>
                            </div>
                        </div>
                    </div>

                    <button class="action-btn play-btn" onclick="startOfflineGame()">🚀 بدء اللعب</button>
                </div>

                <!-- الخطوة 3 (أونلاين): قائمة غرف الأونلاين -->
                <div id="step-online" class="step-container">
                    <button class="nav-back" onclick="goToStep(2)">⟵ رجوع</button>
                    
                    <div class="mode-cards-container">
                        <!-- بطاقة إنشاء الغرفة -->
                        <div class="mode-card create-card" onclick="goToStep('online-create')">
                            <div class="card-icon">➕</div>
                            <div class="card-info">
                                <h4>إنشاء غرفة</h4>
                                <p>اصنع غرفة وادعُ أصدقاءك</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="divider-text"><span>أو الانضمام لغرفة</span></div>
                    
                    <div class="join-box">
                        <input type="text" id="room-code" class="modern-input" placeholder="أدخل كود الغرفة هنا">
                        <button class="action-btn join-btn" onclick="joinRoom()">🔗 انضمام سريع</button>
                    </div>
                </div>

                <!-- الخطوة 4 (أونلاين): إعدادات إنشاء غرفة الأونلاين -->
                <div id="step-online-create" class="step-container">
                    <button class="nav-back" onclick="goToStep('online')">⟵ رجوع</button>
                    
                    <div class="settings-panel">
                        <div class="form-group">
                            <label>👥 عدد اللاعبين</label>
                            <div class="btn-group">
                                <button type="button" class="opt-btn active" onclick="setSelectPlayers(2, this)">2 لاعبين</button>
                                <button type="button" class="opt-btn" onclick="setSelectPlayers(3, this)">3 لاعبين</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>🏆 نقاط الفوز</label>
                            <div class="btn-group">
                                <button type="button" class="opt-btn" onclick="setSelectScore(50, this)">50</button>
                                <button type="button" class="opt-btn active" onclick="setSelectScore(100, this)">100</button>
                                <button type="button" class="opt-btn" onclick="setSelectScore(150, this)">150</button>
                            </div>
                        </div>
                    </div>

                    <button class="action-btn play-btn" onclick="createRoom()">إنشاء الغرفة</button>
                    
                    <div id="created-code-box" class="code-display hidden">
                        <span>شارك هذا الكود مع أصدقائك:</span>
                        <strong id="display-room-id">----</strong>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- نافذة النهاية (Game Over Modal) -->
    <div id="end-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="end-title">انتهت اللعبة!</h2>
            <button class="action-btn primary-btn" style="width: 100%;" onclick="returnToMainMenu()">🏠 العودة للقائمة الرئيسية</button>
        </div>
    </div>

    <!-- =========================================
         Scripts Section 
         ========================================= -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- التحكم في خطوات الشاشة وحفظ الاسم -->
    <script>
        function goToStep(stepId) {
            if(stepId === 2) {
                const nameInput = document.getElementById('player-name-input').value.trim();
                if(!nameInput) {
                    alert("يرجى إدخال اسمك أولاً!");
                    return;
                }
                localStorage.setItem("dominoPlayerName", nameInput);
                document.getElementById('my-name-display').innerText = nameInput;
            }

            document.querySelectorAll('.step-container').forEach(el => {
                el.classList.remove('active-step');
            });
            document.getElementById('step-' + stepId).classList.add('active-step');
        }

        function startOfflineGame() {
            if (typeof window.selectGameMode === "function" && window.state) {
                window.selectGameMode(window.state.selectedPlayersCount);
            } else {
                console.error("ملفات اللعبة (Modules) لم يتم تحميلها بشكل صحيح.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem("dominoPlayerName");
            if(savedName) {
                document.getElementById('player-name-input').value = savedName;
                document.getElementById('my-name-display').innerText = savedName;
            }
        });
    </script>

    <!-- إعدادات Firebase الأساسية -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC28vhM3_RlSPbPYFsb2RL8DO5685Ue_p8",
        authDomain: "dominos-pro-beee8.firebaseapp.com",
        projectId: "dominos-pro-beee8",
        storageBucket: "dominos-pro-beee8.firebasestorage.app",
        messagingSenderId: "184280288087",
        appId: "1:184280288087:web:4976d9e7bd96b93bc04c12"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      window.db = db;
      window.ref = ref;
      window.set = set;
      window.update = update;
      window.onValue = onValue;
    </script>
    
    <!-- محرك اللعبة الأساسي -->
    <script type="module" src="main.js?v=31"></script>
</body>
</html>
