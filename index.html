<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الدومينو الاحترافية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الهيكل الرئيسي للعبة -->
    <main class="game-layout">
        
        <!-- الشريط العلوي: المنافسون -->
        <header class="top-bar">
            <!-- الكمبيوتر 1 -->
            <div id="comp1-avatar" class="profile top-left">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp1" alt="الكمبيوتر 1">
                <div class="profile-info">
                    <span id="comp1-count" class="profile-count">🂠 9</span>
                </div>
            </div>

            <!-- الكمبيوتر 2 (خاص بوضع 3 لاعبين) -->
            <div id="comp2-avatar" class="profile top-right hidden">
                <div class="profile-info">
                    <span id="comp2-count" class="profile-count">🂠 9</span>
                </div>
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=comp2" alt="الكمبيوتر 2">
            </div>
        </header>

        <!-- منطقة الطاولة -->
        <section class="table-container">
            <div id="board-chain"></div>
        </section>

        <!-- الشريط السفلي -->
        <footer class="bottom-bar">
            <!-- اللاعب الحقيقي -->
            <div id="player-avatar" class="profile bottom-left">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=player" alt="اللاعب">
            </div>

            <!-- أوراق اللاعب -->
            <div class="bottom-center">
                <div class="player-hand-wrapper">
                    <div id="player-hand"></div>
                </div>
            </div>

            <!-- زر السوق -->
            <div class="bottom-right">
                <button class="btn-boneyard" onclick="drawFromBoneyard()">
                    🀙 السوق: <span id="boneyard-count" class="count">0</span>
                </button>
            </div>
        </footer>
    </main>

    <!-- النوافذ المنبثقة -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>أهلاً بك في الدومينو! 🎲</h2>
            <p>اختر نظام اللعب للبدء:</p>
            <button class="btn-primary" onclick="selectGameMode(2)">👤 لاعبين (7 أوراق)</button>
            <button class="btn-primary" onclick="selectGameMode(3)">👥 3 لاعبين (9 أوراق / بدون 0-0)</button>
        </div>
    </div>

    <div id="end-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="end-title">انتهت اللعبة!</h2>
            <button class="btn-primary" onclick="showStartModal()">🔄 العب مرة أخرى</button>
        </div>
    </div>

    <script src="script.js?v=11.6"></script>
</body>
</html>
