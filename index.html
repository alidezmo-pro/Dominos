<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- وسوم منع حفظ النسخ القديمة (الكاش) لضمان ظهور التحديثات فوراً -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>لعبة الدومينو المصرية - البريميوم</title>
    
    <!-- ربط ملف التصميم مع تحديث رقم الإصدار إلى v=6.0 لتخطي الكاش -->
    <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. نافذة اختيار نظام اللعب (Modal)         -->
    <!-- ========================================== -->
    <div id="mode-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>🎲 اختر نظام اللعب</h2>
            <p>فضلاً اختر عدد المنافسين للبدء:</p>
            <div class="mode-buttons">
                <button class="btn-primary" onclick="selectGameMode(2)">👤 لاعب ضد الكمبيوتر (لاعبين)</button>
                <button class="btn-secondary" onclick="selectGameMode(3)">👥 ثلاثة لاعبين (أنت ضد 2 كمبيوتر)</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. نافذة سحب الأحجار الشفافة عند انسداد اللعب-->
    <!-- ========================================== -->
    <div id="draw-modal" class="modal-overlay hidden">
        <div class="draw-card">
            <div class="draw-icon">📦</div>
            <h3>لا يوجد لديك حجر مناسب!</h3>
            <p>يجب عليك السحب من السوق للاستمرار في اللعب.</p>
            <button class="btn-draw" onclick="drawFromBoneyard()">سحب حجر من السوق</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. الشاشة الرئيسية والطاولة البيضاوية      -->
    <!-- ========================================== -->
    <div class="main-screen">
        <div class="poker-table">
            
            <!-- منافس 1 (أعلى اليسار) -->
            <div id="comp1-badge" class="avatar-badge top-left">
                <div class="avatar-circle">🤖</div>
                <div class="badge-info">
                    <span class="player-name">الكمبيوتر 1</span>
                    <span id="comp1-count" class="card-pill">🂠 7</span>
                </div>
            </div>

            <!-- منافس 2 (أعلى اليمين - يظهر فقط في نظام الـ 3 لاعبين) -->
            <div id="comp2-badge" class="avatar-badge top-right hidden">
                <div class="avatar-circle">🤖</div>
                <div class="badge-info">
                    <span class="player-name">الكمبيوتر 2</span>
                    <span id="comp2-count" class="card-pill">🂠 7</span>
                </div>
            </div>

            <!-- أيقونة السوق الجانبية المدمجة -->
            <div class="market-icon-box">
                <div class="market-stack">🂠</div>
                <span id="boneyard-count" class="market-count">14</span>
            </div>

            <!-- شريط حالة الدور الحالي -->
            <div id="turn-display" class="turn-status">دورك للعب الآن 🎯</div>

            <!-- زر بدء لعبة جديدة -->
            <button class="restart-btn" onclick="showModeModal()">🔄 لعبة جديدة</button>

            <!-- طاولة اللعب الوسطى لرص السلسلة -->
            <div id="board-chain" class="domino-chain">
                <p class="empty-msg">الطاولة فارغة، اختر حجراً من يدك للبدء</p>
            </div>

            <!-- صورتك الشخصية كلاعب (أسفل اليسار) -->
            <div class="avatar-badge bottom-left">
                <div class="avatar-circle user-avatar">🧔</div>
                <div class="badge-info">
                    <span class="player-name">أنت (اللاعب)</span>
                </div>
            </div>

            <!-- الحاوية المخصصة لأحجارك (في أسفل الشاشة) -->
            <div id="player-hand" class="player-hand-container"></div>

        </div>
    </div>

    <!-- ربط ملف البرمجة مع تحديث رقم الإصدار إلى v=6.0 لتخطي الكاش -->
    <script src="script.js?v=7.0"></script>
</body>
</html>
