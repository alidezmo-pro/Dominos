<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- تدرج خلفية الأيقونة (نفس ألوان اللعبة) -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- تدرج لون حجر الدومينو (عاجي/أبيض 3D) -->
    <linearGradient id="dominoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- مؤثرات الإضاءة والظل -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="15" dy="25" stdDeviation="15" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- خلفية الأيقونة (بحواف دائرية تناسب الموبايل) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />

  <!-- حلقة نيون خلفية -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.3" filter="url(#neonGlow)" />

  <!-- حجر الدومينو الأساسي (مائل بشكل ديناميكي) -->
  <g transform="translate(256, 256) rotate(25) translate(-256, -256)" filter="url(#dropShadow)">
    <rect x="176" y="106" width="160" height="300" rx="20" fill="url(#dominoGrad)" stroke="#cbd5e1" stroke-width="4" />
    
    <!-- الخط الفاصل المحفور -->
    <line x1="186" y1="256" x2="326" y2="256" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    
    <!-- نقاط النصف العلوي (رقم 6) -->
    <circle cx="216" cy="146" r="14" fill="#0f172a" />
    <circle cx="256" cy="146" r="14" fill="#0f172a" />
    <circle cx="296" cy="146" r="14" fill="#0f172a" />
    <circle cx="216" cy="216" r="14" fill="#0f172a" />
    <circle cx="256" cy="216" r="14" fill="#0f172a" />
    <circle cx="296" cy="216" r="14" fill="#0f172a" />
    
    <!-- نقاط النصف السفلي (رقم 6) -->
    <circle cx="216" cy="296" r="14" fill="#0f172a" />
    <circle cx="256" cy="296" r="14" fill="#0f172a" />
    <circle cx="296" cy="296" r="14" fill="#0f172a" />
    <circle cx="216" cy="366" r="14" fill="#0f172a" />
    <circle cx="256" cy="366" r="14" fill="#0f172a" />
    <circle cx="296" cy="366" r="14" fill="#0f172a" />
  </g>

  <!-- نجمة ذهبية لامعة (لإضافة طابع الـ PRO) -->
  <path d="M 120 160 Q 130 130 160 120 Q 130 110 120 80 Q 110 110 80 120 Q 110 130 120 160" fill="#fde047" filter="url(#neonGlow)" />
  
  <!-- نجمة زرقاء لامعة صغيرة -->
  <path d="M 400 400 Q 405 385 425 380 Q 405 375 400 360 Q 395 375 375 380 Q 395 385 400 400" fill="#38bdf8" filter="url(#neonGlow)" />
</svg>
